# Repo-local manifest gate. Temporary until the shared OpenAMRobot
# verification harness provides manifest validation; migrate then.
name: Manifest validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-validation:
    name: manifest-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        # vcstool 0.3.0 imports pkg_resources, which setuptools>=81 removed.
        run: >-
          python -m pip install yamllint==1.38.0 vcstool==0.3.0 PyYAML==6.0.2
          setuptools==79.0.1

      - name: Validator regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate openamrobot.repos
        run: python tools/check_manifest.py openamrobot.repos

      - name: Validate release YAML and immutable refs
        run: |
          python tools/check_manifest.py --offline releases/v2.0.0-rc.1.repos
          python tools/check_release_manifest.py releases/v2.0.0-rc.1.repos --development openamrobot.repos

      - name: Import release into a fresh workspace and verify every SHA
        run: |
          mkdir -p "$RUNNER_TEMP/rc1-workspace"
          vcs import "$RUNNER_TEMP/rc1-workspace" < releases/v2.0.0-rc.1.repos
          vcs export --exact "$RUNNER_TEMP/rc1-workspace" > "$RUNNER_TEMP/rc1-exact.repos"
          python tools/check_release_manifest.py releases/v2.0.0-rc.1.repos --exact-export "$RUNNER_TEMP/rc1-exact.repos"

      - uses: actions/upload-artifact@v4
        with:
          name: rc1-exact-manifest
          path: ${{ runner.temp }}/rc1-exact.repos
